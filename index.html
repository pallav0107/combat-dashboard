<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>⚔️ Combat Arena</title>
<style>
  :root{--bg:#0d1117;--card:#161b22;--line:#30363d;--txt:#e6edf3;--dim:#8b949e;--grn:#3fb950;--red:#f85149;--acc:#58a6ff}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--txt)}
  .wrap{max-width:1100px;margin:0 auto;padding:24px 16px}
  h1{font-size:26px;margin:0 0 2px}
  .sub{color:var(--dim);font-size:13px;margin-bottom:20px}
  .badge{display:inline-block;padding:3px 12px;border-radius:20px;font-weight:600;font-size:13px;background:#1f6feb22;color:var(--acc);border:1px solid #1f6feb55}
  .paper{background:#3fb95022;color:var(--grn);border-color:#3fb95055}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:18px 0}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
  .k{color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.4px}
  .v{font-size:22px;font-weight:700;margin-top:4px}
  .sec{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin:16px 0}
  .sec h2{font-size:15px;margin:0 0 12px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
  th{color:var(--dim);font-weight:600;font-size:12px}
  td.num{text-align:right;font-variant-numeric:tabular-nums}
  .bar{height:8px;background:#21262d;border-radius:4px;overflow:hidden}
  .bar>span{display:block;height:100%;background:linear-gradient(90deg,#1f6feb,#58a6ff)}
  .pos{color:var(--grn)}.neg{color:var(--red)}
  .foot{color:var(--dim);font-size:12px;margin-top:24px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <h1>⚔️ Combat Arena</h1>
  <div class="sub">A coach reads the market regime and deploys a roster of specialist strategies. <span id="mode" class="badge paper">PAPER</span></div>
  <div class="grid" id="metrics"></div>
  <div class="sec"><h2>🎯 Coach's call — <span id="regime">—</span></h2><div id="alloc"></div></div>
  <div class="sec"><h2>📊 Positions</h2><div id="positions">—</div></div>
  <div class="sec"><h2>🥊 The Roster</h2><div id="roster">—</div></div>
  <div class="foot" id="foot">loading…</div>
</div>
<script>
const money=n=>'$'+Math.round(n).toLocaleString();
const pct=n=>(n>=0?'+':'')+n.toFixed(1)+'%';
fetch('combat_state.json?_='+Date.now()).then(r=>r.json()).then(d=>{
  document.getElementById('mode').textContent=d.mode||'PAPER';
  const dp=d.day_pl||0;
  document.getElementById('metrics').innerHTML=[
    ['Equity',money(d.equity)],['Invested',money(d.invested)],['Cash',money(d.cash)],
    ['Today',`<span class="${dp>=0?'pos':'neg'}">${(dp>=0?'+':'')+money(dp)}</span>`],
    ['Notional',money(d.notional)]
  ].map(([k,v])=>`<div class="card"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('');
  document.getElementById('regime').textContent=d.regime||'—';
  const A=d.allocation||{}; const mx=Math.max(...Object.values(A),0.01);
  document.getElementById('alloc').innerHTML=Object.entries(A).sort((a,b)=>b[1]-a[1])
    .map(([f,w])=>`<div style="display:flex;align-items:center;gap:10px;margin:6px 0"><div style="width:80px;font-size:13px">${f}</div><div class="bar" style="flex:1"><span style="width:${(w/mx*100)}%"></span></div><div style="width:44px;text-align:right;font-size:13px;color:var(--dim)">${(w*100).toFixed(0)}%</div></div>`).join('')||'<span style="color:var(--dim)">all cash</span>';
  const P=d.positions||[];
  document.getElementById('positions').innerHTML=P.length?`<table><tr><th>Symbol</th><th class="num">Value</th><th class="num">P&L</th></tr>${P.sort((a,b)=>b.value-a.value).map(p=>`<tr><td>${p.symbol}</td><td class="num">${money(p.value)}</td><td class="num ${p.pl_pct>=0?'pos':'neg'}">${pct(p.pl_pct)}</td></tr>`).join('')}</table>`:'<span style="color:var(--dim)">No positions yet (dry-run — nothing placed).</span>';
  const R=d.roster||[];
  document.getElementById('roster').innerHTML=`<table><tr><th>Fighter</th><th>Style</th><th>Best in</th></tr>${R.map(f=>`<tr><td><b>${f.fighter}</b></td><td style="color:var(--dim)">${f.style}</td><td>${f.best_regime}</td></tr>`).join('')}</table>`;
  document.getElementById('foot').textContent='Updated '+(d.updated||'').replace('T',' ').slice(0,16)+' UTC · paper/dry-run · not investment advice';
}).catch(e=>{document.getElementById('foot').textContent='could not load state: '+e});
</script>
</body>
</html>
