<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>⚔️ Combat Arena</title>
<style>
  :root{--bg:#0d1117;--card:#161b22;--line:#30363d;--txt:#e6edf3;--dim:#8b949e;--grn:#3fb950;--red:#f85149;--acc:#58a6ff}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--txt)}
  /* --- market-conditions RIBBON --- */
  .ribbon{width:100%;padding:14px 16px;text-align:center;color:#0d1117;font-weight:700;position:sticky;top:0;z-index:10;box-shadow:0 2px 10px #0006}
  .ribbon .rlab{font-size:20px;letter-spacing:1px}
  .ribbon .rnote{font-size:13px;font-weight:600;opacity:.85;margin-top:2px}
  .ribbon .rvix{display:inline-block;margin-left:10px;padding:1px 9px;border-radius:20px;background:#0d111733;font-size:12px;vertical-align:middle}
  .wrap{max-width:1100px;margin:0 auto;padding:20px 16px}
  h1{font-size:24px;margin:0 0 2px}
  .sub{color:var(--dim);font-size:13px;margin-bottom:18px}
  .badge{display:inline-block;padding:3px 12px;border-radius:20px;font-weight:600;font-size:13px;background:#3fb95022;color:var(--grn);border:1px solid #3fb95055}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:18px 0}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
  .k{color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.4px}
  .v{font-size:22px;font-weight:700;margin-top:4px}
  .sec{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin:16px 0}
  .sec h2{font-size:15px;margin:0 0 12px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
  th{color:var(--dim);font-weight:600;font-size:12px}
  td.num{text-align:right;font-variant-numeric:tabular-nums}
  .bar{height:8px;background:#21262d;border-radius:4px;overflow:hidden}
  .bar>span{display:block;height:100%;background:linear-gradient(90deg,#1f6feb,#58a6ff)}
  .pos{color:var(--grn)}.neg{color:var(--red)}
  .pill{display:inline-block;padding:1px 8px;border-radius:20px;font-size:11px;border:1px solid var(--line);color:var(--dim)}
  .foot{color:var(--dim);font-size:12px;margin-top:24px;text-align:center;line-height:1.6}
</style>
</head>
<body>
<!-- market-conditions ribbon (populated from state) -->
<div class="ribbon" id="ribbon" style="background:#8b949e">
  <div class="rlab" id="rlab">STANDBY</div>
  <div class="rnote"><span id="rnote">loading market read…</span><span class="rvix" id="rvix" style="display:none"></span></div>
</div>
<div class="wrap">
  <h1>⚔️ Combat Arena</h1>
  <div class="sub">A coach reads live market conditions and fields a roster of specialist call-signs. <span id="mode" class="badge">PAPER</span></div>
  <div class="grid" id="metrics"></div>
  <div class="sec"><h2>🎯 Coach's posture</h2><div id="posture"></div></div>
  <div class="sec"><h2>📊 Exposure by asset class</h2><div id="positions">—</div></div>
  <div class="sec"><h2>🥊 The Roster</h2><div id="roster">—</div></div>
  <div class="foot" id="foot">loading…</div>
</div>
<script>
const money=n=>'$'+Math.round(n).toLocaleString();
const pct=n=>(n>=0?'+':'')+n.toFixed(1)+'%';
fetch('combat_state.json?_='+Date.now()).then(r=>r.json()).then(d=>{
  // --- ribbon ---
  const rb=document.getElementById('ribbon'); rb.style.background=d.regime_color||'#8b949e';
  document.getElementById('rlab').textContent='MARKET CONDITIONS · '+(d.regime_label||'STANDBY');
  document.getElementById('rnote').textContent=d.regime_note||'';
  if(d.vix!=null){const rv=document.getElementById('rvix');rv.style.display='inline-block';rv.textContent='VIX '+d.vix;}
  document.getElementById('mode').textContent=d.mode==='DRY_RUN'?'PAPER · DRY-RUN':'PAPER · LIVE';
  // --- metrics ---
  const dp=d.day_pl||0;
  document.getElementById('metrics').innerHTML=[
    ['Equity',money(d.equity)],['Invested',money(d.invested)],['Cash',money(d.cash)],
    ['Today',`<span class="${dp>=0?'pos':'neg'}">${(dp>=0?'+':'')+money(dp)}</span>`],
    ['Deployed notional',money(d.notional)]
  ].map(([k,v])=>`<div class="card"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('');
  // --- posture (role-level, recipe hidden) ---
  const P=d.posture||{}; const mx=Math.max(...Object.values(P),0.01);
  document.getElementById('posture').innerHTML=Object.entries(P)
    .map(([role,w])=>`<div style="display:flex;align-items:center;gap:10px;margin:7px 0"><div style="width:110px;font-size:13px">${role}</div><div class="bar" style="flex:1"><span style="width:${(w/mx*100)}%"></span></div><div style="width:44px;text-align:right;font-size:13px;color:var(--dim)">${(w*100).toFixed(0)}%</div></div>`).join('')||'<span style="color:var(--dim)">standing by — all reserve</span>';
  // --- exposure by asset class (no tickers) ---
  const pos=d.positions||[], pend=d.pending||{count:0};
  let html='';
  if(pos.length){
    html=`<table><tr><th>Asset class</th><th class="num">Holdings</th><th class="num">Value</th><th class="num">P&L</th></tr>${pos.map(p=>`<tr><td>${p.class}</td><td class="num">${p.count}</td><td class="num">${money(p.value)}</td><td class="num ${p.pl_pct>=0?'pos':'neg'}">${pct(p.pl_pct)}</td></tr>`).join('')}</table>`;
  }else if(pend.count){
    html=`<div style="color:var(--acc)">⏳ ${pend.count} orders queued (${money(pend.notional)} notional) — filling at next open${d.next_open?' ('+d.next_open.replace('T',' ').slice(0,16)+' ET)':''}.</div>`;
  }else{
    html=`<span style="color:var(--dim)">${d.mode==='DRY_RUN'?'Dry-run — no live exposure.':'No open exposure.'}</span>`;
  }
  document.getElementById('positions').innerHTML=html;
  // --- roster: call-signs + broad role + status (method hidden) ---
  const R=d.roster||[];
  document.getElementById('roster').innerHTML=`<table><tr><th>Call-sign</th><th>Role</th><th class="num">Status</th></tr>${R.map(f=>`<tr><td><b>${f.callsign}</b></td><td style="color:var(--dim)">${f.role}</td><td class="num"><span class="pill">${f.status}</span></td></tr>`).join('')}</table>`;
  const modelbl=d.mode==='DRY_RUN'?'paper · dry-run':'paper · live (no real money)';
  document.getElementById('foot').innerHTML='Updated '+(d.updated||'').replace('T',' ').slice(0,16)+' UTC · '+modelbl+'<br>Strategy internals are proprietary and intentionally not shown · not investment advice';
}).catch(e=>{document.getElementById('foot').textContent='could not load state: '+e});
</script>
</body>
</html>
